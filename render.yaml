# Blueprint Render – sin Docker
# 1. Postgres en Neon → copiá la URL
# 2. New → Blueprint → conectá este repo
# 3. Completá DATABASE_URL, CORS_ORIGINS y NEXT_PUBLIC_API_URL
#
# Importante: el contenido del repo debe tener backend/ y frontend/ en la raíz
# (no una carpeta gestion-comercial/ anidada).

services:
  - type: web
    name: gestion-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start_cloud.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "false"
      - key: CREATE_DEMO_DATA
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: gestion-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        sync: false
